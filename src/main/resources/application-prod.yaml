spring:
  config:
    import: optional:file:./.env.properties
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  application:
    name: "velaCMS"
  data:
    mongodb:
      uri: ${MONGODB_URI}
      auto-index-creation: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
app:
  storage:
    root: ./data
    supabase:
      endpoint: ${SUPABASE_S3_ENDPOINT}
      access-key: ${SUPABASE_S3_ACCESS_KEY}
      secret-key: ${SUPABASE_S3_SECRET_KEY}
      region: ${SUPABASE_S3_REGION}
      bucket: ${SUPABASE_S3_BUCKET}
  security:
    otp:
      cache-key-prefix: ${OTP_CACHE_KEY_PREFIIX}
      hashed-otp-field: ${OTP_HASHED_OTP_FIELD}
      attempts-field: ${OTP_ATTEMPTS_FIELD}
    cors:
      allowedOrigins: ${ALLOWED_ORIGINS}
    accessToken:
      secret: ${ACCESS_TOKEN_SECRET}
      ttlMins: 15
      issuer: "velaCMS"
    stimulus:
      cookieName: ${STIMULUS_NAME}
      secret: ${STIMULUS_SECRET}
      appender: ${STIMULUS_APPENDER}
      algorithm: ${STIMULUS_ALGORITHM}
      ttlDays: 14
  redis:
    hostName: ${REDIS_HOSTNAME}
    port: ${REDIS_PORT}
    password: ${REDIS_PASSWORD}
    accessTokenKeyPrefix: ${ACCESS_TOKEN_KEY_PREFIX}
    sessionHashKeyPrefix: ${SESSION_HASH_KEY_PREFIX}
    sessionHashUserIdField: ${SESSION_HASH_USER_ID_FIELD}
    sessionHashSignaturePrefixField: ${SESSION_HASH_SIGNATURE_PREFIX_FIELD}